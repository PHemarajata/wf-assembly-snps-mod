name: checks

# Four jobs, none of which needs isolate data. The analysis repository
# (bp-recombination-aware-snps) has had CI since 2026-09-02; this one had none,
# which is how a documented fix that never existed survived for weeks. These
# check the things that can be checked without a run.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  nextflow-config:
    name: config resolves and the params are declared
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 25.04.6 produced the reported run and 25.10.0 the cross-hardware
        # control, so those two say the pinned runs still resolve. 24.10.5 is
        # the oldest version this config is claimed to work on and 26.04.6 is
        # latest-stable, which did not parse this config at all until the six
        # strict-parser fixes recorded in PROVENANCE.md. Both ends are tested
        # because the 26.x breakage was found by CI on its first run, and
        # because a floor nothing tests is a floor nobody can rely on.
        nxf: ["24.10.5", "25.04.6", "25.10.0", "26.04.6"]
    steps:
      - uses: actions/checkout@v4
      - uses: nf-core/setup-nextflow@v2
        with:
          version: ${{ matrix.nxf }}
      - name: config resolves
        # Not `> /dev/null`: Nextflow writes its errors to stdout, so discarding
        # stdout turns a failure into an exit code with no message. The first
        # run of this workflow failed here in 1.7s with nothing to read.
        run: |
          nextflow -version
          if ! nextflow config . > /tmp/cfg.out 2> /tmp/cfg.err; then
            echo "--- stdout ---"; cat /tmp/cfg.out
            echo "--- stderr ---"; cat /tmp/cfg.err
            exit 1
          fi
          echo "ok: config resolved, $(wc -l < /tmp/cfg.out) lines"
      - name: determinism parameters are present and sane
        # These two are the reason this repository has CI at all. gubbins_seed
        # removes a 1-in-10,001 draw that silently loses a unit; a zero or
        # missing value reinstates it. gubbins_deterministic is what actually
        # buys byte-reproducibility. A rename or an accidental deletion should
        # fail the build rather than be discovered in a run.
        run: |
          cfg=$(nextflow config .)
          echo "$cfg" | grep -qE 'gubbins_seed *= *[0-9]+' \
            || { echo "REFUSING: gubbins_seed missing or not an integer"; exit 1; }
          seed=$(echo "$cfg" | grep -oE 'gubbins_seed *= *[0-9]+' | grep -oE '[0-9]+$')
          [ "$seed" -gt 0 ] \
            || { echo "REFUSING: gubbins_seed must be positive; RAxML rejects a non-positive parsimony seed"; exit 1; }
          echo "$cfg" | grep -q 'gubbins_deterministic' \
            || { echo "REFUSING: gubbins_deterministic missing"; exit 1; }
          echo "ok: gubbins_seed = $seed, gubbins_deterministic declared"

  strict-config:
    name: config stays parseable by the strict parser
    runs-on: ubuntu-latest
    # Nextflow 26.x rejects function definitions, variable declarations, control
    # flow and bare environment variables in config files. Each of those was
    # present and each was fixed; this stops them coming back, and it fails
    # without needing a 26.x download.
    steps:
      - uses: actions/checkout@v4
      - name: no config-scope defs, control flow or bare env vars
        run: |
          python3 - <<'PY'
          import pathlib, re, sys
          bad, checked = [], 0
          for f in sorted(list(pathlib.Path('conf').rglob('*.config')) + [pathlib.Path('nextflow.config')]):
              checked += 1
              for i, ln in enumerate(f.read_text().splitlines(), 1):
                  s = ln.strip()
                  if s.startswith('//') or s.startswith('*') or s.startswith('/*'):
                      continue
                  if re.match(r'(def|final)\s+\w+\s*[=(]', s):
                      bad.append(f"{f}:{i}: config-scope definition -- {s[:60]}")
                  if re.match(r'(if|for|while)\s*\(', s):
                      bad.append(f"{f}:{i}: control flow in config -- {s[:60]}")
                  for m in re.finditer(r'\$\{([A-Z][A-Z0-9_]{2,})\}', ln):
                      dollar_brace = chr(36) + "{"
                      bad.append(f"{f}:{i}: bare env var {dollar_brace}{m.group(1)}}} -- use System.getenv()")
          if checked < 10:
              sys.exit(f"REFUSING: only {checked} config files scanned; the glob is broken, not the code.")
          if bad:
              sys.exit("strict-parser hazards:\n  " + "\n  ".join(bad))
          print(f"ok: {checked} config files carry no strict-parser hazard")
          PY
      - name: resourceLimits is late-bound
        # Written as a plain list, params.max_* is read once at parse time and a
        # ceiling set in a later -c overlay is silently ignored. Measured: the
        # list form caps at 12 where a later override says 4. The closure form
        # caps at 4, which is what check_max() did. This is the one way the
        # replacement can differ from what it replaced, so it is asserted.
        run: |
          python3 - <<'PY'
          import pathlib, re, sys
          bad, found = [], 0
          for f in sorted(pathlib.Path('conf').rglob('*.config')):
              for i, ln in enumerate(f.read_text().splitlines(), 1):
                  if 'resourceLimits' not in ln or ln.strip().startswith('//'):
                      continue
                  found += 1
                  if not re.search(r'resourceLimits\s*=\s*\{', ln):
                      bad.append(f"{f}:{i}: not a closure -- {ln.strip()[:70]}")
          if found < 7:
              sys.exit(f"REFUSING: found {found} resourceLimits declarations, expected at least 7.")
          if bad:
              sys.exit("parse-time resourceLimits:\n  " + "\n  ".join(bad))
          print(f"ok: all {found} resourceLimits declarations are closures")
          PY

  every-gubbins-call-is-seeded:
    name: no run_gubbins.py call omits the seed
    runs-on: ubuntu-latest
    # The defect this closes: --seed was absent from every call site for the
    # life of the repository while six documents recorded it as fixed. A new
    # call site added without it would silently reintroduce a ~16% per-panel
    # chance of losing a unit while exiting 0.
    steps:
      - uses: actions/checkout@v4
      - name: each invocation passes a seed
        # Verified to fail: deleting one seed line makes this exit 1. Two earlier
        # drafts did not, and both passed the positive test, so neither would
        # have caught anything:
        #   1. A fixed 25-line window spans two adjacent call sites and finds
        #      the neighbour's seed.
        #   2. Matching a single trailing backslash matches nothing at all. The
        #      Groovy script block writes the shell continuation as '\\', so the
        #      check found zero invocations and passed over an empty set.
        # Hence EXPECT below: an assertion over an empty set is not an assertion.
        run: |
          python3 - <<'PY'
          import pathlib, re, sys
          EXPECT = 5   # 3 in gubbins_cluster, 2 in recombination_gubbins
          bad, found = [], 0
          for f in sorted(pathlib.Path('modules').rglob('main.nf')):
              lines = f.read_text().splitlines()
              for i, ln in enumerate(lines):
                  if not re.search(r'run_gubbins\.py\s*\\+\s*$', ln):
                      continue
                  found += 1
                  # the invocation runs while lines end with a continuation
                  block, j = [ln], i + 1
                  while j < len(lines):
                      block.append(lines[j])
                      if not lines[j].rstrip().endswith('\\'):
                          break
                      j += 1
                  if not any(re.search(r'seed_arg|SEED_ARG|--seed', b) for b in block):
                      bad.append(f"{f}:{i+1}")
          if found < EXPECT:
              sys.exit(f"REFUSING: found {found} run_gubbins.py invocations, expected at "
                       f"least {EXPECT}. The detector is broken, not the code.")
          if bad:
              sys.exit("UNSEEDED run_gubbins.py invocation(s):\n  " + "\n  ".join(bad))
          print(f"ok: all {found} run_gubbins.py invocations pass a seed")
          PY

  every-iqtree-call-is-seeded:
    name: no IQ-TREE call omits the seed or the thread control
    runs-on: ubuntu-latest
    # The defect this closes is the gubbins_seed defect, in a second place.
    # gubbins_deterministic governed Gubbins and never governed IQ-TREE, while
    # conf/params.config asserted the same measurement for IQ-TREE and nothing
    # acted on it. All five IQ-TREE invocations ran unseeded and multi-threaded,
    # including the one that builds the reported global ML tree.
    steps:
      - uses: actions/checkout@v4
      - name: each invocation is seeded and thread-controlled
        run: |
          python3 - <<'PY'
          import pathlib, re, sys
          EXPECT = 5   # iqtree_asc 1, iqtree_fast 1, global_ml_tree 2, build_integrated_tree 1
          bad, found = [], 0
          # Deliberately loose. The narrow version missed the real IQTREE_ASC
          # call: that one is written as an escaped shell variable, so the
          # character before the dollar is a backslash, which was not in the
          # allowed set. It matched an echo of an error message instead, and the
          # count guard is what caught that. Match anything naming the tool and
          # let the -s requirement decide, which is a positive test rather than a
          # list of things to skip.
          call = re.compile(r'(?:iqtree2?|IQTREE)')
          for f in sorted(pathlib.Path('modules').rglob('main.nf')):
              lines = f.read_text().splitlines()
              for i, ln in enumerate(lines):
                  if not call.search(ln):
                      continue
                  # --version probes and the versions.yml lines are not analyses
                  if '--version' in ln or 'versions.yml' in ln or 'command -v' in ln:
                      continue
                  block, j = [ln], i + 1
                  while j < len(lines) and len(block) < 14:
                      block.append(lines[j])
                      if not lines[j].rstrip().endswith('\\'):
                          break
                      j += 1
                  text = '\n'.join(block)
                  # An invocation writes output under a prefix. Two narrower
                  # tests were tried and both produced false positives that a
                  # reader would learn to ignore: matching the tool name alone
                  # caught `if [ -z "$IQTREE" ]` and an echo of an error
                  # message, and additionally requiring '-s ' caught
                  # `[ -s gml.iqtree ]`, where -s is the shell's file test.
                  # --prefix appears in all five real invocations and in no
                  # shell test.
                  if '--prefix' not in text:
                      continue
                  found += 1
                  if 'iq_seed_arg' not in text and '-seed' not in text:
                      bad.append(f"{f}:{i+1}: no seed")
                  if 'iq_threads' not in text:
                      bad.append(f"{f}:{i+1}: threads not under the determinism control")
                  if '-nt AUTO' in text:
                      bad.append(f"{f}:{i+1}: -nt AUTO sizes to the host, not to task.cpus")
          if found < EXPECT:
              sys.exit(f"REFUSING: found {found} IQ-TREE invocations, expected at least "
                       f"{EXPECT}. The detector is broken, not the code.")
          if bad:
              sys.exit("IQ-TREE invocations not under determinism control:\n  " + "\n  ".join(bad))
          print(f"ok: all {found} IQ-TREE invocations are seeded and thread-controlled")
          PY

  syntax:
    name: python and shell parse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: python parses
        run: |
          fail=0
          while IFS= read -r f; do
            python3 -c "import ast,sys; ast.parse(open(sys.argv[1]).read())" "$f" \
              || { echo "SYNTAX FAIL: $f"; fail=1; }
          done < <(find bin -name '*.py' 2>/dev/null; ls *.py 2>/dev/null)
          exit $fail
      - name: workflow files carry no accidental Actions expression
        # GitHub evaluates ${ {   } } anywhere in a workflow file, including inside a
        # run: block. A Python f-string emitting that literal made this very
        # workflow fail in 0s with no log and no annotation beyond "workflow file
        # issue", which is the least debuggable failure CI can produce.
        run: |
          python3 - <<'PY'
          import pathlib, re, sys
          allowed = re.compile(r'(matrix|github|env|secrets|inputs|steps|needs|runner|job)\.')
          bad, checked = [], 0
          for f in sorted(pathlib.Path('.github/workflows').glob('*.yml')):
              checked += 1
              for i, ln in enumerate(f.read_text().splitlines(), 1):
                  for m in re.finditer(re.escape(chr(36) + '{{') + r'(.*?)}}', ln):
                      if not allowed.search(m.group(1)):
                          bad.append(f"{f}:{i}: {ln.strip()[:70]}")
          if checked < 1:
              sys.exit("REFUSING: no workflow files scanned.")
          if bad:
              sys.exit("unintended Actions expression:\n  " + "\n  ".join(bad))
          print(f"ok: {checked} workflow file(s), no unintended expression")
          PY
      - name: no Groovy comment inside a shell script block
        # A `//` comment inside the triple-quoted script string is not a comment.
        # Nextflow emits it into .command.sh verbatim and bash tries to run it,
        # which fails with "//: Is a directory" and exit 126, after the real work
        # in the task has already succeeded. Nothing about the line looks wrong.
        # Cost one full smoke-test pair to find. Shell comments are '#'.
        run: |
          python3 - <<'PY'
          import pathlib, re, sys
          bad, blocks = [], 0
          for f in sorted(pathlib.Path('modules').rglob('main.nf')):
              txt = f.read_text()
              for m in re.finditer(r'"""(.*?)"""', txt, re.S):
                  blocks += 1
                  start = txt[:m.start()].count('\n') + 1
                  for k, ln in enumerate(m.group(1).splitlines()):
                      if ln.strip().startswith('//'):
                          bad.append(f"{f}:{start+k+1}: {ln.strip()[:70]}")
          if blocks < 20:
              sys.exit(f"REFUSING: found {blocks} script blocks, expected at least 20. "
                       f"The detector is broken, not the code.")
          if bad:
              sys.exit("Groovy comments inside shell script blocks:\n  " + "\n  ".join(bad))
          print(f"ok: {blocks} script blocks, no Groovy comment inside any of them")
          PY
      - name: no heredoc can swallow its own terminator
        # `<<-` strips leading TABS only. A space-indented terminator is not
        # recognised, bash closes the heredoc at end-of-file with a warning, and
        # the terminator line is written into the file as content. That reached
        # the published software_versions.yml as a stray "    END_VERSIONS".
        #
        # It bites only where Nextflow does not dedent the script block, and
        # Nextflow dedents by the block's MINIMUM indentation, so one wrapped
        # error message starting at column 0 silently arms every heredoc in that
        # process. 43 of 44 sites in this repository work for that reason alone.
        # The rule below is what actually holds: a terminator at column 0 is
        # recognised whether or not the block is dedented.
        run: |
          python3 - <<'PY'
          import pathlib, re, sys
          bad, found = [], 0
          for f in sorted(pathlib.Path('modules').rglob('main.nf')):
              lines = f.read_text().splitlines()
              for i, ln in enumerate(lines):
                  # Both forms occur: `cat <<TERM > file` and `cat > file <<TERM`.
                  # The first version of this pattern only matched the former and
                  # silently skipped 5 sites, which is how the published
                  # software_versions.yml kept its mixed indentation after a fix
                  # that was supposed to make it uniform.
                  m = re.search(r"cat\b[^<>\n]*(?:>\s*\S+\s*)?<<(-?)\s*(['\"]?)(\w+)\2", ln)
                  if not m:
                      continue
                  found += 1
                  dash, term = m.group(1), m.group(3)
                  # 400, not 60: graft_subtrees writes a 240-line bash script
                  # through a heredoc, and a 60-line window reported it as
                  # unterminated when its terminator was fine.
                  for j in range(i + 1, min(i + 400, len(lines))):
                      if lines[j].strip() != term:
                          continue
                      indent = lines[j][:len(lines[j]) - len(lines[j].lstrip())]
                      if indent and not (dash == '-' and '\t' in indent):
                          bad.append(f"{f}:{j+1}: terminator {term} is indented "
                                     f"{len(indent)} spaces; put it at column 0")
                      break
                  else:
                      bad.append(f"{f}:{i+1}: no terminator {term} within 400 lines")
          if found < 20:
              sys.exit(f"REFUSING: found {found} heredocs, expected at least 20. "
                       f"The detector is broken, not the code.")
          if bad:
              sys.exit("heredocs that can swallow their terminator:\n  " + "\n  ".join(bad))
          print(f"ok: all {found} heredoc terminators are at column 0")
          PY
      - name: shell parses
        run: |
          fail=0
          while IFS= read -r f; do
            bash -n "$f" || { echo "PARSE FAIL: $f"; fail=1; }
          done < <(find . -name '*.sh' -not -path './work/*' -not -path './.git/*')
          exit $fail

  schema:
    name: nextflow_schema.json is valid and matches params
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: schema parses and declares the determinism parameters
        run: |
          python3 - <<'PY'
          import json, sys
          d = json.load(open('nextflow_schema.json'))
          props = {}
          for grp in d.get('definitions', {}).values():
              props.update(grp.get('properties', {}))
          missing = [p for p in ('gubbins_seed', 'gubbins_deterministic') if p not in props]
          if missing:
              sys.exit(f"REFUSING: not declared in schema: {missing}")
          print("ok: schema valid;", len(props), "parameters declared")
          PY
